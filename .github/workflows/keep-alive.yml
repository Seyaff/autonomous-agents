# Pings the API so Render's free plan doesn't put it to sleep after 15 minutes idle.
# A sleeping server makes the first WhatsApp message slow, and Meta can time it out.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://siyaf.onrender.com/api/v1/health/)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1
